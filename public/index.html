<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏃 Tag Arena — Joue avec tes amis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>

  <!-- Écran d'accueil -->
  <div id="menu" class="screen">
    <h1 class="logo">🏃 <span>Tag</span> Arena</h1>
    <p class="tagline">Attrape tes amis... ou fuis-leur !</p>

    <div class="card">
      <input id="playerName" type="text" maxlength="16" placeholder="Ton pseudo" autocomplete="off">
      <div class="btn-row">
        <button id="btnCreate" class="btn btn-primary">🎮 Créer un salon</button>
        <button id="btnJoinToggle" class="btn btn-secondary">🔑 Rejoindre</button>
      </div>
      <div id="joinBox" class="hidden">
        <input id="roomCode" type="text" maxlength="6" placeholder="CODE DU SALON" autocomplete="off">
        <button id="btnJoin" class="btn btn-primary">Rejoindre</button>
      </div>
    </div>
  </div>

  <!-- Écran du salon -->
  <div id="lobby" class="screen hidden">
    <div class="card lobby-card">
      <h2>Salon <span id="lobbyCode" class="code"></span></h2>
      <p class="hint">Partage ce code à tes amis !
        <button id="btnCopy" class="btn btn-small btn-secondary">📋 Copier</button>
      </p>
      <ul id="playerList" class="player-list"></ul>
      <button id="btnStart" class="btn btn-primary hidden">▶ Lancer la partie</button>
      <p id="lobbyHint" class="hint">En attente d'au moins 2 joueurs...</p>
    </div>
  </div>

  <!-- Écran de jeu -->
  <div id="game" class="screen hidden">
    <div class="hud">
      <div id="timer" class="timer">⏱ 90</div>
      <div id="roleBadge" class="badge"></div>
      <div id="scoreboard" class="scoreboard"></div>
    </div>
    <canvas id="canvas" width="800" height="560"></canvas>
    <p class="controls">🎮 Déplace-toi avec les <b>flèches</b> ou <b>ZQSD / WASD</b></p>
    <div class="chat-box">
      <ul id="chatLog"></ul>
      <div class="chat-input">
        <input id="chatInput" type="text" maxlength="200" placeholder="Message...">
        <button id="btnSend" class="btn btn-small btn-primary">Envoyer</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Overlay fin de manche -->
  <div id="roundOverlay" class="overlay hidden">
    <div class="card">
      <h2>Fin de manche !</h2>
      <ul id="roundScores"></ul>
      <p>Nouvelle manche dans 5s...</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
